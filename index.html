<title>Untitled monograph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
  /* Plain white, Times New Roman, default HTML formatting; only sizes are set. Tinos stands in where Times New Roman is not installed. */
  :root { color-scheme: light; }
  body {
    background: #fff;
    color: #000;
    margin: 0;
    font-family: "Times New Roman", Times, Tinos, serif;
    font-size: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px 32px;
  }
  .piece h1 { font-size: 1.6em; }
  .text h2 { font-size: 1.3em; }
  .text h3 { font-size: 1.1em; }
  /* Wide math, code and tables scroll inside themselves instead of widening the page on phones. */
  pre, table, mjx-container[display="true"] { display: block; overflow-x: auto; }
  /* A turning plate sits in a square, so its quarter turn stays inside the same space. */
  .turn { display: block; width: min(320px, 100%); aspect-ratio: 1; cursor: pointer; }
  .turn img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.9s ease-in-out; }
  .turn[aria-pressed="true"] img { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .turn img { transition: none; } }
  .turning { text-align: center; }
  .turning .turn { margin: 0 auto; }
  /* A side panel sits right of a vertical rule drawn like the horizontal ones; on narrow screens it moves below. */
  .cols { display: flex; }
  .cols > .text:first-child { flex: 1; min-width: 0; }
  .vrule { flex: none; width: 0; margin: 0 20px; border: 1px inset; color: gray; }
  .panel { flex: none; width: 270px; }
  /* Panel images all show at one size, each fitted whole into the same square. */
  .panel img { display: block; width: 240px; height: 240px; object-fit: contain; }
  .panel p, .panel figure { margin: 0 0 1em; }
  .panel figcaption { font-size: 0.8em; }
  .panel p:empty { display: none; }
  .cols .turning { position: sticky; top: 16px; }
  @media (max-width: 760px) {
    .cols { display: block; }
    .vrule { width: auto; height: 0; margin: 1.5em 0; }
    .panel { width: auto; }
    .panel p, .panel figure { display: inline-block; vertical-align: top; margin: 0 12px 12px 0; }
    .panel img { width: 150px; height: 150px; }
    .cols .turning { position: static; }
  }
</style>

<script>
  const BOOK = {"title": "Untitled monograph", "author": "", "chapters": [{"title": "On the nature of Inquiry", "pieces": [{"title": "Critique and Counterfactuals vs. G.H. Hardy", "file": "1.1 Critique and Counterfactuals.md", "text": ""}, {"title": "FAQs - Formalisms of Answers and Questions", "file": "1.2 FAQs.md", "text": ""}]}, {"title": "Experiments with cognition", "pieces": [{"title": "Planting seeds for degeneracy - or - can I force subjective/divergent interpretation through substitution and omission?", "file": "2.1 Planting seeds for degeneracy.md", "text": "## A bookstore named Blossoms\n\nLate afternoon. Brilliant yellows eroding to the cooler hues of evening hours. Coffee, perfume, laptops, and loners: brown of polished wood, a glint of burnished steel.\n\nA step through a doorway. Sigh. Greys.\n\nA flight of stairs to go. A shiver. Climbed enough of those during restless nights. Nights are interesting. Black, and white. A blank canvas, a shade containing them all. The veil over the face of death. Anyway.\n\nThe bookstore. The name: lavender, lily, an old tree laden with pink. Blossoms. Enter, a burst of sienna: memories. Greeting friends of old. Faded white, the color of ghosts, for that\u2019s what they are: haunting cobwebbed attics of the mind, remnants of worlds abandoned.\n\nA glint of chrome: the face of the wristwatch; a touch of blue: shelving, a dozen goodbyes.\n\nRed: the color of blush and the color of the thumping heart \u2013 a beautiful face. A fleck of yellow: a realization of opportunity, an excuse to talk.\n\n\u201cSo, I am doing a project. I am supposed to survey people visiting this bookstore and report what attracts them to fiction. Would you like to participate?\u201d\n\nShe walked off. Purple: red, drowned in blue. Oh well.\n\nWhite. A blank stare, vision, without sight. White. Color of new pages. White. Marred by brown. A small colony, dusty and impoverished. Old among the new, old suffocated by the new. Haha, an amusing simile spelled out of paper.\n\nYellow again, a task to do. Black: leather, color of the forgotten, cemetery of the shades.\n\nAh, a crinkle of paper faded to parchment. That peculiar scent: woody, damp and somehow, somehow saying \u201cI belonged\u201d. Small indents, traced in gold font. \u201cHeinrich\u201d. Hmm, German folklore. Black and gold, a missing red. A missed metaphor. A small smile.\n\nA scribbling inside! Indigo, the color of ink. Indigo, the color of the supernatural, some bear ghosts of more than one world lost.\n\n\u201cMy heart is marked for Undine\u2019s black depths, but it lives gray, mortal, alive, yearning your white touch, Bertalda\u201d\n\nA play of two \u2013 red, shaded with pink, innocence. Twin lines of a calligraphy pen, impeccable slants spelling his love.\n\nGreen. Union. Yellow, a small smile, discovery of beautiful bond, blue, melancholy, the books no more hers. Green, a reminder of two, lost, to fate or to time.\n\nRed, alarm. Eyes over my shoulder. Red, another blush. She said, \u201cMy turn!\u201d We talked.\n\n\u201cI don\u2019t like it here. In this world. It\u2019s...suffocating. I can\u2019t fly. It\u2019s my desire to. Sometimes it\u2019s unbearable. In these books, I see chance. Things that can be. Someday, I\u2019ll do just that. Craft chance. There will be invention, balanced by annihilation. A beautiful new wasteland, of which I shall soar above.\nNo books nor chance shall know my name in this authorless world. But in mine, I\u2019ll fly, free.\u201d\n\nAnother flash of chrome. Another goodbye. 10-digit numbers. A promise of again. 10-digit numbers on white screen. Haha, another ghost.\n\nScience. Fiction. What is. What could be.\n\nSienna. Burnt with faded red. What could have been.\n\nSienna, shaded pink. A bookstore named Blossoms.\n\n## Self - teaching, masking and what's common between a JEPA model and you"}, {"title": "Farewell! I wish you grief and suffering.", "file": "2.2 Farewell.md", "text": "## on neurobiology of sorrow\n\n## Painting sorrow\n\nCome gather, set fire to beauty\nShatter fools\u2019 tributes to hope\nEnact futility in face of a life of chaos\nOr, give up\nGive in to shackles\nTo servitude\nMyriad of masters yanking your leash\nEach breath obstacle to death, to peace\nAbandon reason\nGrief is gospel\nTo answers unspoken\nTo questions unknown\nKneel before vexation\nAccept fate of the damned\nAnd the damned are destined to bleed\nCry red impaled on shards of shattered hope\nAnd splinters of the beautiful things you broke.\n\n* * *\n\nTheseus stood at mast,\nCrete approached fast.\nEscape the Labyrinth of Minos he must,\nIn word of Delphi\u2019s oracle, he put his trust.\nA tale lost to time,\nThe ancient sybil\u2019s rhyme:\nDedalus built no maze, it\u2019s true\nMinos cages no monster,\nThe minotaur, she lives in you.\nLabyrinth of mirrors,\nNo way out.\nTwisted appearance,\nAbode of doubt.\nNot all paths lead to Rome;\nTwisting meanders of the labyrinth,\nYou shall come to call them home.\nBeware, it\u2019s a house you share,\nThe maze is prowled by a wraith;\nMortals call her Guilt,\nOlder than the Gods,\nShe\u2019s the rift in your faith.\nBearer of the bull\u2019s head,\nIn her wake, nightmares thrive,\nVilest of fell beasts,\nGuilt, she eats you alive!\nOut, out, smash your way to day\u2019s light\nShattered mirrors reflect your broken visage,\nPieces never put together right.\nOne mirror, a thousand shards, a million reflections appose\nDespair, hero!\nYou escape mazes, but the labyrinth only grows.\n\nShaken and morose, Theseus gave in to deceit\nAway, from Crete, alone, the hero\u2019s place he forfeit.\nIt was late night, days after, when he first asked \u201cWhat if\u2026\u201d\nThe demigod sobbed as he realized: he was in the Labyrinth.\n\n## Grief, madness and suffering as a the source of true imagination\n\n## The thin line between struggling, suffering and assembly line creativity\n\n## Exploring surrealism as a method to induce creativity rather than display it and the obvious ceiling of this art form."}]}, {"title": "Let it stand | Designing Artemis Republic", "pieces": [{"title": "Notes on designing a Logo for the Artemis Republic", "file": "3.1 Notes on designing a Logo.md", "text": "![The seal](figures/3.1/marks/C01-closeup.png#turn)\n\n:::panel\n![P06](figures/3.1/marks/P06-thursday-upper-left.png)\n\n![P10](figures/3.1/marks/P10-thursday-lower-right.png)\n\n![P01](figures/3.1/marks/P01-todo-left.png)\n\n![P02](figures/3.1/marks/P02-todo-right.png)\n\n![P03](figures/3.1/marks/P03-notes.png)\n\n![P04](figures/3.1/marks/P04-friday-upper.png)\n\n![P05](figures/3.1/marks/P05-friday-lower.png)\n\n![P07](figures/3.1/marks/P07-thursday-top-right.png)\n\n![P08](figures/3.1/marks/P08-thursday-middle.png)\n\n![P09](figures/3.1/marks/P09-thursday-lower.png)\n\n![P11](figures/3.1/marks/P11-wednesday-left.png)\n\n![P12](figures/3.1/marks/P12-wednesday-right.png)\n\n![P13](figures/3.1/marks/P13-tuesday-upper.png)\n\n![P14](figures/3.1/marks/P14-tuesday-lower.png)\n\n![I01](figures/3.1/marks/I01-todo-left.png)\n\n![I02](figures/3.1/marks/I02-todo-right.png)\n\n![I03](figures/3.1/marks/I03-notes-upper.png)\n\n![I04](figures/3.1/marks/I04-notes-lower.png)\n\n![I05](figures/3.1/marks/I05-saturday-sunday-upper.png)\n\n![I06](figures/3.1/marks/I06-saturday-sunday-lower.png)\n\n![I07](figures/3.1/marks/I07-friday-upper.png)\n\n![I08](figures/3.1/marks/I08-friday-lower.png)\n\n![I09](figures/3.1/marks/I09-thursday.png)\n\n![I10](figures/3.1/marks/I10-wednesday.png)\n\n![I11](figures/3.1/marks/I11-tuesday-upper.png)\n\n![I12](figures/3.1/marks/I12-tuesday-lower.png)\n\n![I13](figures/3.1/marks/I13-monday.png)\n\n![C02](figures/3.1/marks/C02-logo-2.png)\n\n![C01](figures/3.1/marks/C01-closeup.png)\n:::"}, {"title": "The nature of a debate of only truths - or - How to win when your opponent\u2019s argument is merely true", "file": "3.2 The nature of a debate of only truths.md", "text": ""}, {"title": "We seek new truth to enginee       <li><b>${c + 1}. ${esc(chapter.title)}</b>
        <ul>${pieces.filter((piece) => piece.chapterNumber === c + 1).map((piece) => `
          <li><a href="#${piece.id}">${piece.id} ${esc(piece.title)}</a>${unwritten(piece) ? ' <i>(not written yet)</i>' : ''}</li>`).join('')}
        </ul>
      </li>`).join('');
    main.innerHTML = `
      <h1>${esc(BOOK.title)}</h1>
      ${BOOK.author ? `<p><i>${esc(BOOK.author)}</i></p>` : ''}
      <hr>
      <h2>Contents</h2>
      <ul>${chapters}</ul>
      <hr>`;
  }

  // Old-style navigation lines: Next, Up and Previous.
  function nav(piece, prev, next) {
    return [
      next && `<b>Next:</b> <a href="#${next.id}">${next.id} ${esc(next.title)}</a>`,
      `<b>Up:</b> <a href="#contents">${piece.chapterNumber}. ${esc(piece.chapterTitle)}</a>`,
      prev && `<b>Previous:</b> <a href="#${prev.id}">${prev.id} ${esc(prev.title)}</a>`,
    ].filter(Boolean).join('<br>');
  }

  function showPiece(i) {
    current = i;
    const piece = pieces[i];
    const prev = pieces[i - 1];
    const next = pieces[i + 1];
    document.title = `${piece.title} - ${BOOK.title}`;
    main.innerHTML = `
      <p>${nav(piece, prev, next)}</p>
      <hr>
      <div class="piece">
        <h1>${piece.id} ${esc(piece.title)}</h1>
        ${piece.subtitle ? `<p><i>${esc(piece.subtitle)}</i></p>` : ''}
        ${body(piece)}
      </div>
      <hr>
      <p>${nav(piece, prev, next)}</p>`;
    window.typesetBook();
  }

  // Text between a line ":::panel" and a line ":::" goes in a side panel, right of a vertical rule.
  const PANEL = /^:::panel[ \t]*\n([\s\S]*?)\n:::[ \t]*$/m;
  function body(piece) {
    if (unwritten(piece)) return '<div class="text"><p><i>Not written yet.</i></p></div>';
    const panel = piece.text.match(PANEL);
    if (!panel) return `<div class="text">${render(piece.text)}</div>`;
    const rest = (piece.text.slice(0, panel.index) + piece.text.slice(panel.index + panel[0].length)).trim();
    return `<div class="cols"><div class="text">${render(rest)}</div><div class="vrule"></div><div class="text panel">${render(panel[1])}</div></div>`;
  }

  function route() {
    const i = pieces.findIndex((piece) => piece.id === location.hash.slice(1));
    if (i < 0) showContents(); else showPiece(i);
    window.scrollTo(0, 0);
  }

  document.addEventListener('keydown', (event) => {
    if (current < 0 || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.target.closest && event.target.closest('input, textarea, select, [contenteditable]')) return;
    const target = event.key === 'ArrowLeft' ? pieces[current - 1] : event.key === 'ArrowRight' ? pieces[current + 1] : null;
    if (target) location.hash = target.id;
  });
  // A tap, Enter or Space gives a plate its quarter turn; the next one turns it back.
  const turn = (plate) => plate.setAttribute('aria-pressed', String(plate.getAttribute('aria-pressed') !== 'true'));
  main.addEventListener('click', (event) => {
    const plate = event.target.closest('.turn');
    if (plate) turn(plate);
  });
  main.addEventListener('keydown', (event) => {
    const plate = event.target.closest && event.target.closest('.turn');
    if (plate && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      turn(plate);
    }
  });
  window.addEventListener('hashchange', route);
  // A preview build names the piece it opens on.
  if (!location.hash && BOOK.start) history.replaceState(null, '', `#${BOOK.start}`);
  route();
})();
</script>
</body>
</html>
